// Types the Compose compiler treats as stable although they are compiled without it.
//
// Every model in these packages is immutable all the way down: data classes and sealed types with read-only
// `val`s, holding only other such models, strings, numbers and read-only collections that are never mutated
// after construction. Screens render them directly, so a recomposition can skip whatever did not change.
// Keep it that way: a mutable type here would make the UI skip updates silently.
dev.opendungeon.core.model.**
dev.opendungeon.domain.**
dev.opendungeon.feature.*.domain.**
